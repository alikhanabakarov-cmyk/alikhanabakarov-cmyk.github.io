<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Страница не найдена — GastroConnect</title>
<meta name="theme-color" content="#0b2a2c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b2a2c;color:#eaf3ee;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:560px;text-align:center}
  .code{font-size:96px;line-height:1;font-weight:700;color:#7fd8ae;letter-spacing:-.04em}
  h1{margin:16px 0 8px;font-size:28px}
  p{margin:0;color:#a9c2b7;line-height:1.6}
  nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
  a{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid #2c4d46;color:#eaf3ee;text-decoration:none;font-weight:600}
  a.primary{background:#7fd8ae;border-color:#7fd8ae;color:#0b2a2c}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Страница не найдена</h1>
  <p>Такой страницы нет или она переехала. Начните с главной или выберите нужный раздел GastroConnect.</p>
  <nav>
    <a class="primary" href="/">На главную</a>
    <a href="/workers">Сотрудникам</a>
    <a href="/restaurants">Заведениям</a>
    <a href="/suppliers">Поставщикам</a>
    <a href="/menu">Меню и техкарты</a>
    <a href="/contacts">Контакты</a>
  </nav>
</main>
</body>
</html>
