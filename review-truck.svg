<svg width="88" height="56" viewBox="0 0 88 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <!-- Сочный изумрудно-зеленый градиент кузова фургона GastroConnect -->
                    <linearGradient id="vanGreenGrad" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#4ade80"/>
                      <stop offset="30%" stop-color="#22c55e"/>
                      <stop offset="75%" stop-color="#16a34a"/>
                      <stop offset="100%" stop-color="#14532d"/>
                    </linearGradient>
                    <!-- Крыша фургона с легким контрастным светом -->
                    <linearGradient id="vanRoofGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#86efac"/>
                      <stop offset="60%" stop-color="#22c55e"/>
                      <stop offset="100%" stop-color="#15803d"/>
                    </linearGradient>
                    <!-- Тонированные стекла кабины с небесным отражением -->
                    <linearGradient id="vanGlassGrad" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#f0f9ff"/>
                      <stop offset="35%" stop-color="#bae6fd"/>
                      <stop offset="75%" stop-color="#38bdf8"/>
                      <stop offset="100%" stop-color="#0284c7"/>
                    </linearGradient>
                    <!-- Литые диски колес -->
                    <linearGradient id="vanWheelRim" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#f8fafc"/>
                      <stop offset="45%" stop-color="#cbd5e1"/>
                      <stop offset="100%" stop-color="#64748b"/>
                    </linearGradient>
                    <!-- Хром для бамперов и зеркал -->
                    <linearGradient id="vanChrome" x1="0" y1="0" x2="1" y2="0">
                      <stop offset="0%" stop-color="#94a3b8"/>
                      <stop offset="40%" stop-color="#ffffff"/>
                      <stop offset="75%" stop-color="#cbd5e1"/>
                      <stop offset="100%" stop-color="#64748b"/>
                    </linearGradient>
                    <!-- Золотисто-оранжевая плашка логотипа Gastro -->
                    <linearGradient id="vanBadgeGrad" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#fbbf24"/>
                      <stop offset="100%" stop-color="#f59e0b"/>
                    </linearGradient>
                  </defs>

                  <!-- Тень от фургона на трассе -->
                  <ellipse cx="44" cy="50" rx="38" ry="4.5" fill="rgba(0,0,0,0.45)" />

                  <!-- Задний бампер и брызговик -->
                  <rect x="3" y="42" width="5" height="5" rx="1" fill="#1e293b" stroke="#090d16" stroke-width="0.8"/>
                  <!-- Выхлопная труба с хромом -->
                  <rect x="2" y="45" width="4" height="2.5" rx="1" fill="url(#vanChrome)"/>

                  <!-- Основной грузовой кузов и кабина (монокок фургона) -->
                  <!-- Задняя вертикаль, крыша со скосом к лобовому стеклу, капот и перед -->
                  <path d="M6 14C6 11.5 8 9.5 10.5 9.5H58C62 9.5 65.5 11 68 14.5L76.5 25.5C78 27.5 79 30 79 33V42C79 43.5 77.5 45 76 45H10C7.8 45 6 43.2 6 41V14Z" fill="url(#vanGreenGrad)" stroke="#090d16" stroke-width="1.8"/>

                  <!-- Верхнее ребро крыши с бликом -->
                  <path d="M10 11H58C61.5 11 64.5 12.5 66.8 15.5L73.5 24H9C7.5 24 6.5 22 6.5 20V14.5C6.5 12.5 8 11 10 11Z" fill="url(#vanRoofGrad)" opacity="0.6"/>

                  <!-- Ребра жесткости грузового отсека (характерные полосы современного цельнометаллического фургона) -->
                  <line x1="8" y1="26" x2="52" y2="26" stroke="#15803d" stroke-width="1.6" stroke-linecap="round"/>
                  <line x1="8" y1="29.5" x2="52" y2="29.5" stroke="#15803d" stroke-width="1.6" stroke-linecap="round"/>
                  <line x1="8" y1="33" x2="52" y2="33" stroke="#15803d" stroke-width="1.6" stroke-linecap="round"/>

                  <!-- Вертикальный шов сдвижной боковой двери фургона -->
                  <line x1="38" y1="13" x2="38" y2="44" stroke="#090d16" stroke-width="1.4" opacity="0.65"/>
                  <!-- Ручка сдвижной двери -->
                  <rect x="34" y="27" width="3" height="1.8" rx="0.8" fill="#0f172a" stroke="#ffffff" stroke-width="0.5"/>

                  <!-- Шов двери кабины водителя -->
                  <line x1="53" y1="12" x2="53" y2="44" stroke="#090d16" stroke-width="1.4" opacity="0.65"/>
                  <!-- Ручка водительской двери -->
                  <rect x="55" y="28" width="4" height="1.8" rx="0.8" fill="#0f172a" stroke="#ffffff" stroke-width="0.5"/>

                  <!-- Окна кабины водителя -->
                  <!-- Боковое окно водителя со скосом -->
                  <path d="M55 14H64C66.5 14 68.5 15.5 70 18L72.5 24H55V14Z" fill="url(#vanGlassGrad)" stroke="#090d16" stroke-width="1.4"/>
                  <!-- Лобовое стекло (видимое сбоку в перспективе) -->
                  <path d="M72.5 18L76 25H72.5V18Z" fill="#e0f2fe" opacity="0.8"/>

                  <!-- Водитель / экспедитор в кабине (в стильной кепке) -->
                  <circle cx="61.5" cy="19" r="3.2" fill="#fed7aa"/>
                  <path d="M59 17C59 15 64 15 64 17H59Z" fill="#1e293b"/>
                  <path d="M62 17H66" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>

                  <!-- Зеркало заднего вида (хром + корпус) -->
                  <rect x="71" y="22" width="3" height="6" rx="1.2" fill="#1e293b" stroke="#090d16" stroke-width="0.8"/>
                  <rect x="71.5" y="22.5" width="2" height="5" rx="0.8" fill="url(#vanChrome)"/>

                  <!-- Фирменный логотип GastroConnect на борту фургона -->
                  <rect x="12" y="15" width="23" height="11" rx="3" fill="#ffffff" stroke="#15803d" stroke-width="1" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.15))"/>
                  <!-- Круглый бейдж GC с вилкой -->
                  <circle cx="16.5" cy="20.5" r="3.5" fill="url(#vanBadgeGrad)"/>
                  <text x="16.5" y="22.5" font-size="4.5" font-weight="900" fill="#78350f" text-anchor="middle" font-family="system-ui, sans-serif">GC</text>
                  <!-- Надпись GASTRO -->
                  <text x="21" y="19" font-size="3.5" font-weight="900" fill="#15803d" font-family="system-ui, sans-serif">GASTRO</text>
                  <text x="21" y="23" font-size="2.8" font-weight="700" fill="#ea580c" font-family="system-ui, sans-serif">EXPRESS</text>

                  <!-- Капот фургона и радиаторная решетка спереди -->
                  <path d="M76.5 25.5H81C82 25.5 83 27 83 29V39C83 40.5 81.5 42 80 42H76V25.5Z" fill="url(#vanGreenGrad)" stroke="#090d16" stroke-width="1.5"/>
                  <!-- Передняя решетка радиатора -->
                  <path d="M80 34H83V40H80V34Z" fill="#1e293b"/>
                  <line x1="81" y1="36" x2="83" y2="36" stroke="#cbd5e1" stroke-width="0.8"/>
                  <line x1="81" y1="38" x2="83" y2="38" stroke="#cbd5e1" stroke-width="0.8"/>

                  <!-- Передняя большая блок-фара со светодиодным бликом -->
                  <path d="M78 28H82.5L81.5 33H78V28Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
                  <rect x="79" y="29" width="2" height="2" rx="0.5" fill="#ffffff"/>

                  <!-- Противотуманная фара в бампере -->
                  <circle cx="80.5" cy="41" r="1.5" fill="#fef08a" stroke="#eab308" stroke-width="0.6"/>

                  <!-- Передний мощный бампер -->
                  <path d="M77 41H83.5C84.5 41 85 42 85 43.5C85 45 84 45.5 82.5 45.5H75V41H77Z" fill="#1e293b" stroke="#090d16" stroke-width="1.2"/>

                  <!-- Колесные арки (глубокие круглые вырезы) -->
                  <path d="M14 45C14 37.5 27 37.5 27 45" fill="#090d16"/>
                  <path d="M59 45C59 37.5 72 37.5 72 45" fill="#090d16"/>

                  <!-- Заднее колесо фургона (крупное с литым диском) -->
                  <circle cx="20.5" cy="44.5" r="9" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
                  <circle cx="20.5" cy="44.5" r="6" fill="url(#vanWheelRim)" stroke="#334155" stroke-width="1.2"/>
                  <!-- Спицы диска -->
                  <circle cx="20.5" cy="44.5" r="3.2" fill="#090d16"/>
                  <line x1="20.5" y1="39" x2="20.5" y2="50" stroke="#64748b" stroke-width="1.6"/>
                  <line x1="15" y1="44.5" x2="26" y2="44.5" stroke="#64748b" stroke-width="1.6"/>
                  <circle cx="20.5" cy="44.5" r="1.5" fill="#cbd5e1"/>

                  <!-- Переднее колесо фургона -->
                  <circle cx="65.5" cy="44.5" r="9" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
                  <circle cx="65.5" cy="44.5" r="6" fill="url(#vanWheelRim)" stroke="#334155" stroke-width="1.2"/>
                  <!-- Спицы переднего диска -->
                  <circle cx="65.5" cy="44.5" r="3.2" fill="#090d16"/>
                  <line x1="65.5" y1="39" x2="65.5" y2="50" stroke="#64748b" stroke-width="1.6"/>
                  <line x1="60" y1="44.5" x2="71" y2="44.5" stroke="#64748b" stroke-width="1.6"/>
                  <circle cx="65.5" cy="44.5" r="1.5" fill="#cbd5e1"/>
                </svg>